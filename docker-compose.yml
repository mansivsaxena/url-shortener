services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: WebService-Assignment-URL-shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  auth:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    environment:
      APP_HOST: 0.0.0.0
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: WebService-Assignment-URL-shortener
      DB_PORT: 5432
      PYTHONPATH: /app
    expose:
      - "8001"
    depends_on:
      - db

  shortener:
    build:
      context: .
      dockerfile: url_shortener_service/Dockerfile
    environment:
      APP_HOST: 0.0.0.0
      AUTH_SERVICE_URL: http://auth:8001
      DB_HOST: db        
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: WebService-Assignment-URL-shortener
      DB_PORT: 5432
      PYTHONPATH: /app
    expose:
      - "8000"
    depends_on:
      - auth
      - db

  gateway:
    image: nginx:alpine
    depends_on:
      - auth
      - shortener
      - db
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data: