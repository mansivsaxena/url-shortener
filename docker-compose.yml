services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    environment:
      APP_HOST: 0.0.0.0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_HOST: db
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy

  shortener:
    build:
      context: .
      dockerfile: url_shortener_service/Dockerfile
    environment:
      APP_HOST: 0.0.0.0
      AUTH_SERVICE_URL: http://auth:8001
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_HOST: db
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started

  gateway:
    image: nginx:alpine
    depends_on:
      - auth
      - shortener
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata: